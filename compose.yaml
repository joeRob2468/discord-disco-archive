# Local / default deployment. On the home server, layer compose.server.yaml on top
# (set COMPOSE_FILE=compose.yaml:compose.server.yaml in that machine's .env).
#
# Storage follows the home server's convention: app state under APP_DATA_DIR
# (mounted at /config), recordings under RECORDINGS_HOST_DIR (mounted at /recordings).
name: discord-stream-recorder

services:
  recorder:
    build:
      context: .
      dockerfile: apps/recorder/Dockerfile
      args:
        BROWSER_CHANNEL: ${BROWSER_CHANNEL:-firefox}
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    init: true
    # Time to finalise the current set's capture and leave voice on shutdown.
    stop_grace_period: 30s
    # Recommended by Playwright for Chromium (shared memory).
    ipc: host
    mem_limit: 3g
    restart: unless-stopped
    env_file: .env
    environment:
      RECORDINGS_DIR: /recordings
      PROFILE_DIR: /config/profile
    volumes:
      - ${APP_DATA_DIR:-./docker-data}/recorder:/config
      - ${RECORDINGS_HOST_DIR:-./data/recordings}:/recordings
    ports:
      # Loopback only: Docker-published ports bypass host firewalls such as ufw.
      - 127.0.0.1:${VNC_PORT:-6080}:6080

  archive:
    build:
      context: .
      dockerfile: apps/archive/Dockerfile
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      RECORDINGS_DIR: /recordings
      ARCHIVE_DATA_DIR: /config
    volumes:
      - ${APP_DATA_DIR:-./docker-data}/archive:/config
      # Writable so admins can delete sets and sessions, and upload sets (into uploads/).
      - ${RECORDINGS_HOST_DIR:-./data/recordings}:/recordings
    ports:
      - 127.0.0.1:${ARCHIVE_PORT:-3000}:${ARCHIVE_PORT:-3000}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.ARCHIVE_PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
